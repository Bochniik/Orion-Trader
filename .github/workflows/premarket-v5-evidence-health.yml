name: Premarket V5 evidence health

on:
  workflow_dispatch:
  schedule:
    # Runs after the latest active 09:15 ET snapshot plus acquisition-maturity slack in both EDT and EST.
    - cron: "0 16 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: premarket-v5-evidence-health
  cancel-in-progress: false

jobs:
  score-blind-evidence-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # The forward workflow became decision-grade after the 2026-09-11 session;
      # Monday 2026-09-14 is therefore the first eligible collection session.
      EVIDENCE_START_DATE: "2026-09-14"
      # Scripts import sibling modules through the scripts.* package namespace.
      # Executing a file by path otherwise puts only scripts/ on sys.path in CI.
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify evidence-health script entrypoint imports
        run: python scripts/audit_premarket_v5_horizon_evidence_health.py --help >/dev/null

      - name: Collect scheduled runs and immutable prediction artifacts
        run: |
          python scripts/collect_premarket_v5_actions_evidence.py \
            --start-date "$EVIDENCE_START_DATE" \
            --output-dir backend/data/cloud_shadow/premarket_v5/evidence-health-input

      - name: Build horizon-aware score-blind evidence-health report
        shell: bash
        run: |
          INPUT_DIR="backend/data/cloud_shadow/premarket_v5/evidence-health-input"
          REPORT="backend/data/cloud_shadow/premarket_v5/evidence-health-report.json"
          AS_OF="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mapfile -t PAYLOADS < <(find "$INPUT_DIR/predictions" -maxdepth 1 -type f -name 'prediction-*.json' -print | sort)
          if [ "${#PAYLOADS[@]}" -gt 0 ]; then
            python scripts/audit_premarket_v5_horizon_evidence_health.py \
              --runs-json "$INPUT_DIR/runs.json" \
              --input "${PAYLOADS[@]}" \
              --start-date "$EVIDENCE_START_DATE" \
              --as-of "$AS_OF" \
              --output "$REPORT"
          else
            python - "$INPUT_DIR/runs.json" "$EVIDENCE_START_DATE" "$AS_OF" "$REPORT" <<'PY'
          from datetime import date
          import json
          from pathlib import Path
          import sys
          import scripts.audit_premarket_v5_horizon_evidence_health as audit
          import scripts.audit_premarket_v5_evidence_health as base

          runs_path, start_date, as_of, report_path = sys.argv[1:]
          report = audit.build_evidence_health_report(
              base._load_runs(Path(runs_path)),
              [],
              start_date=date.fromisoformat(start_date),
              as_of=base._parse_timestamp(as_of, field="as_of"),
          )
          Path(report_path).write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(report["summary"], sort_keys=True))
          PY
          fi

      - name: Upload horizon-aware score-blind evidence health
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premarket-v5-evidence-health-${{ github.run_id }}
          path: |
            backend/data/cloud_shadow/premarket_v5/evidence-health-input/runs.json
            backend/data/cloud_shadow/premarket_v5/evidence-health-input/collection-summary.json
            backend/data/cloud_shadow/premarket_v5/evidence-health-report.json
          if-no-files-found: warn
          retention-days: 90
