name: Premarket V5 evidence health

on:
  workflow_dispatch:
  schedule:
    # Runs after the latest active 09:15 ET snapshot plus acquisition-maturity slack in both EDT and EST.
    - cron: "0 16 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: premarket-v5-evidence-health
  cancel-in-progress: false

jobs:
  score-blind-evidence-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      EVIDENCE_START_DATE: "2026-09-14"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Collect scheduled runs and immutable prediction artifacts
        run: |
          python scripts/collect_premarket_v5_actions_evidence.py \
            --start-date "$EVIDENCE_START_DATE" \
            --output-dir backend/data/cloud_shadow/premarket_v5/evidence-health-input

      - name: Build score-blind evidence-health report
        shell: bash
        run: |
          INPUT_DIR="backend/data/cloud_shadow/premarket_v5/evidence-health-input"
          REPORT="backend/data/cloud_shadow/premarket_v5/evidence-health-report.json"
          mapfile -t PAYLOADS < <(find "$INPUT_DIR/predictions" -maxdepth 1 -type f -name 'prediction-*.json' -print | sort)
          ARGS=(
            --runs-json "$INPUT_DIR/runs.json"
            --start-date "$EVIDENCE_START_DATE"
            --as-of "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            --output "$REPORT"
          )
          if [ "${#PAYLOADS[@]}" -gt 0 ]; then
            ARGS+=(--input "${PAYLOADS[@]}")
          fi
          python scripts/audit_premarket_v5_evidence_health.py "${ARGS[@]}"

      - name: Upload score-blind evidence health
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premarket-v5-evidence-health-${{ github.run_id }}
          path: |
            backend/data/cloud_shadow/premarket_v5/evidence-health-input/runs.json
            backend/data/cloud_shadow/premarket_v5/evidence-health-input/collection-summary.json
            backend/data/cloud_shadow/premarket_v5/evidence-health-report.json
          if-no-files-found: warn
          retention-days: 90
