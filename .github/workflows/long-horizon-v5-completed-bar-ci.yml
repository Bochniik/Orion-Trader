name: Long-horizon V5 completed-bar CI

on:
  pull_request:
    paths:
      - "scripts/run_long_horizon_v5_paired_cloud_shadow.py"
      - "backend/tests/test_long_horizon_v5_completed_bar_guard.py"
      - ".github/workflows/long-horizon-v5-completed-bar-ci.yml"
      - "docs/research/LONG_HORIZON_V5_COMPLETED_BAR_GUARD.md"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest
      - name: Compile completed-bar components
        run: |
          python -m py_compile scripts/run_long_horizon_v5_paired_cloud_shadow.py
          python -m py_compile backend/tests/test_long_horizon_v5_completed_bar_guard.py
      - name: Run completed-bar regressions
        run: |
          cd backend
          python -m pytest -q tests/test_long_horizon_v5_completed_bar_guard.py
