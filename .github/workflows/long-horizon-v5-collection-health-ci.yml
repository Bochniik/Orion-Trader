name: Long-horizon V5 collection health CI

on:
  pull_request:
    paths:
      - "scripts/summarize_long_horizon_v5_collection_health.py"
      - "backend/tests/test_long_horizon_v5_collection_health_summary.py"
      - ".github/workflows/long-horizon-v5-evidence-cycle.yml"
      - ".github/workflows/long-horizon-v5-collection-health-ci.yml"
      - "docs/research/LONG_HORIZON_V5_COLLECTION_HEALTH_SUMMARY.md"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest
      - name: Compile collection health components
        run: |
          python -m py_compile scripts/summarize_long_horizon_v5_collection_health.py
          python -m py_compile backend/tests/test_long_horizon_v5_collection_health_summary.py
      - name: Verify scheduled evidence-cycle health wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/long-horizon-v5-evidence-cycle.yml').read_text(encoding='utf-8')
          assert 'Build aggregate score-blind collection health' in workflow
          assert 'summarize_long_horizon_v5_collection_health.py' in workflow
          assert 'find .long-shadow/predictions' in workflow
          assert 'collection-health-' in workflow
          assert 'long-horizon-v5-collection-health-' in workflow
          assert 'github.run_id' in workflow
          assert 'if-no-files-found: error' in workflow
          build = workflow.index('Build aggregate score-blind collection health')
          settle = workflow.index('Settle mature paired predictions')
          assert build < settle
          PY
      - name: Run collection health regressions
        run: |
          cd backend
          python -m pytest -q tests/test_long_horizon_v5_collection_health_summary.py
