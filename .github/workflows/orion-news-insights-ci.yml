name: Orion news insights CI

on:
  pull_request:
    paths:
      - "backend/app/services/orion_ai_service.py"
      - "backend/app/services/market_data.py"
      - "backend/app/api/routes.py"
      - "backend/tests/test_orion_ai_service.py"
      - "backend/tests/test_market_data.py"
      - "frontend/src/api/api.js"
      - "frontend/src/api/api.test.js"
      - "frontend/src/core/AnalyzeView.jsx"
      - "frontend/src/components/StockNewsPanel.jsx"
      - "frontend/src/components/StockNewsPanel.test.jsx"
      - "frontend/src/analysis-news-context.css"
      - ".github/workflows/orion-news-insights-ci.yml"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest

      - name: Compile news intelligence path
        run: |
          python -m py_compile backend/app/services/orion_ai_service.py
          python -m py_compile backend/app/services/market_data.py
          python -m py_compile backend/app/api/routes.py

      - name: Run focused backend tests
        run: |
          python -m pytest -q             backend/tests/test_orion_ai_service.py             backend/tests/test_market_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run focused frontend tests
        working-directory: frontend
        run: npm test -- src/api/api.test.js src/components/StockNewsPanel.test.jsx

      - name: Build frontend
        working-directory: frontend
        run: npm run build
