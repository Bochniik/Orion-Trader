name: Long-horizon V5 paired evidence cycle

on:
  workflow_dispatch:
  schedule:
    # Run after prediction windows and after long horizons have had time to mature.
    - cron: "40 15-22 * * 1-5"

permissions:
  actions: read
  contents: read

concurrency:
  group: long-horizon-v5-paired-evidence-cycle
  cancel-in-progress: false

jobs:
  settle-paired-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify market-data credentials
        shell: bash
        run: |
          if [ -z "$ALPACA_API_KEY_ID" ] || [ -z "$ALPACA_API_SECRET_KEY" ]; then
            echo "Missing existing repository market-data credentials." >&2
            exit 2
          fi
      - name: Recover and authenticate paired predictions and prior dedicated ledger
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .long-shadow/predictions .long-shadow/prior .long-shadow/recovered
          CUTOFF_EPOCH=$(date -u -d '35 days ago' +%s)
          COUNT=0
          LEDGER_FOUND=0
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id,.name,.created_at,.expires_at,(.workflow_run.id // ""),(.workflow_run.head_sha // "")] | @tsv' > /tmp/long-shadow-artifacts-raw.tsv
          python scripts/sort_long_horizon_v5_recovery_artifacts.py \
            /tmp/long-shadow-artifacts-raw.tsv \
            /tmp/long-shadow-artifacts.tsv
          while IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_NAME CREATED_AT EXPIRES_AT ARTIFACT_RUN_ID ARTIFACT_HEAD_SHA; do
            if [ "$LEDGER_FOUND" -eq 0 ] && [[ "$ARTIFACT_NAME" == long-horizon-v5-evidence-ledger-* ]]; then
              LEDGER_RUN_ID="${ARTIFACT_NAME##*-}"
              if ! [[ "$LEDGER_RUN_ID" =~ ^[0-9]+$ ]]; then
                echo "Malformed long-horizon ledger artifact run id: $ARTIFACT_NAME" >&2
                exit 3
              fi
              if [ "$ARTIFACT_RUN_ID" != "$LEDGER_RUN_ID" ]; then
                echo "Ledger artifact producing run mismatch: artifact=$ARTIFACT_NAME metadata_run=$ARTIFACT_RUN_ID" >&2
                exit 5
              fi
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LEDGER_RUN_ID}" > "/tmp/long-ledger-run-${LEDGER_RUN_ID}.json"
              LEDGER_HEAD_SHA=$(jq -r '.head_sha // ""' "/tmp/long-ledger-run-${LEDGER_RUN_ID}.json")
              if [ "${ARTIFACT_HEAD_SHA,,}" != "${LEDGER_HEAD_SHA,,}" ]; then
                echo "Ledger artifact head SHA does not match producing run metadata: $ARTIFACT_NAME" >&2
                exit 5
              fi
              LEDGER_EVENT=$(jq -r '.event // ""' "/tmp/long-ledger-run-${LEDGER_RUN_ID}.json")
              if [ "$LEDGER_EVENT" != "schedule" ]; then
                continue
              fi
              LEDGER_DIR=".long-shadow/recovered/ledger-${ARTIFACT_ID}"
              mkdir -p "$LEDGER_DIR"
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "/tmp/long-ledger-${ARTIFACT_ID}.zip"
              unzip -q -o "/tmp/long-ledger-${ARTIFACT_ID}.zip" -d "$LEDGER_DIR"
              LEDGER="$LEDGER_DIR/ledger.json"
              if [ ! -f "$LEDGER" ]; then
                echo "Expected ledger payload missing from artifact $ARTIFACT_NAME" >&2
                exit 4
              fi
              python scripts/validate_long_horizon_v5_ledger_origin.py \
                --ledger "$LEDGER" \
                --artifact-name "$ARTIFACT_NAME" \
                --run-metadata "/tmp/long-ledger-run-${LEDGER_RUN_ID}.json" \
                --allow-legacy-sealed-migration
              cp "$LEDGER" .long-shadow/prior/ledger.json
              LEDGER_FOUND=1
              continue
            fi
            if [[ "$ARTIFACT_NAME" == long-horizon-v5-paired-shadow-* ]]; then
              CREATED_EPOCH=$(date -u -d "$CREATED_AT" +%s)
              if [ "$CREATED_EPOCH" -lt "$CUTOFF_EPOCH" ]; then
                continue
              fi
              RUN_ID="${ARTIFACT_NAME##*-}"
              if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
                echo "Malformed long-horizon artifact run id: $ARTIFACT_NAME" >&2
                exit 3
              fi
              if [ "$ARTIFACT_RUN_ID" != "$RUN_ID" ]; then
                echo "Prediction artifact producing run mismatch: artifact=$ARTIFACT_NAME metadata_run=$ARTIFACT_RUN_ID" >&2
                exit 5
              fi
              RECOVERED_DIR=".long-shadow/recovered/${ARTIFACT_ID}"
              mkdir -p "$RECOVERED_DIR"
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > "/tmp/long-run-${RUN_ID}.json"
              RUN_HEAD_SHA=$(jq -r '.head_sha // ""' "/tmp/long-run-${RUN_ID}.json")
              if [ "${ARTIFACT_HEAD_SHA,,}" != "${RUN_HEAD_SHA,,}" ]; then
                echo "Prediction artifact head SHA does not match producing run metadata: $ARTIFACT_NAME" >&2
                exit 5
              fi
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "/tmp/long-prediction-${ARTIFACT_ID}.zip"
              unzip -q -o "/tmp/long-prediction-${ARTIFACT_ID}.zip" -d "$RECOVERED_DIR"
              PREDICTION="$RECOVERED_DIR/prediction-${RUN_ID}.json"
              if [ ! -f "$PREDICTION" ]; then
                echo "Expected prediction payload missing from artifact $ARTIFACT_NAME" >&2
                exit 4
              fi
              python scripts/validate_long_horizon_v5_artifact_origin.py \
                --prediction "$PREDICTION" \
                --artifact-name "$ARTIFACT_NAME" \
                --run-metadata "/tmp/long-run-${RUN_ID}.json"
              cp "$PREDICTION" ".long-shadow/predictions/prediction-${RUN_ID}.json"
              COUNT=$((COUNT + 1))
            fi
          done < /tmp/long-shadow-artifacts.tsv
          echo "prediction_artifacts=$COUNT" >> "$GITHUB_OUTPUT"
          echo "ledger_found=$LEDGER_FOUND" >> "$GITHUB_OUTPUT"
      - name: Settle mature paired predictions
        id: settle
        if: steps.recover.outputs.prediction_artifacts != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/data/cloud_shadow/long_horizon_v5 backend/data/cloud_shadow/long_horizon_v5/evidence
          mapfile -t PREDICTIONS < <(find .long-shadow/predictions -type f -name 'prediction-*.json' | sort)
          python scripts/settle_long_horizon_v5_shadow.py \
            "${PREDICTIONS[@]}" \
            --feed iex \
            --score-blind-summary \
            --output backend/data/cloud_shadow/long_horizon_v5/evaluation-${{ github.run_id }}.json
      - name: Accumulate dedicated append-only ledger
        if: steps.recover.outputs.prediction_artifacts != '0'
        shell: bash
        run: |
          set -euo pipefail
          EVAL="backend/data/cloud_shadow/long_horizon_v5/evaluation-${{ github.run_id }}.json"
          PRIOR=$(find .long-shadow/prior -type f -name 'ledger.json' | head -n 1 || true)
          if [ -n "$PRIOR" ]; then
            python scripts/accumulate_cloud_shadow_evidence.py "$EVAL" \
              --existing "$PRIOR" \
              --score-blind-summary \
              --output backend/data/cloud_shadow/long_horizon_v5/evidence/ledger.json
          else
            python scripts/accumulate_cloud_shadow_evidence.py "$EVAL" \
              --score-blind-summary \
              --output backend/data/cloud_shadow/long_horizon_v5/evidence/ledger.json
          fi
      - name: Preserve prior ledger on no-op cycle
        if: steps.recover.outputs.prediction_artifacts == '0' && steps.recover.outputs.ledger_found == '1'
        shell: bash
        run: |
          mkdir -p backend/data/cloud_shadow/long_horizon_v5/evidence
          PRIOR=$(find .long-shadow/prior -type f -name 'ledger.json' | head -n 1)
          cp "$PRIOR" backend/data/cloud_shadow/long_horizon_v5/evidence/ledger.json
      - name: Attest cumulative ledger to exact evidence-cycle run
        if: steps.recover.outputs.prediction_artifacts != '0' || steps.recover.outputs.ledger_found == '1'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_long_horizon_v5_ledger_origin.py \
            --ledger backend/data/cloud_shadow/long_horizon_v5/evidence/ledger.json \
            --attest \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --head-sha "${{ github.sha }}" \
            --event-name "${{ github.event_name }}"
      - name: Build score-blind readiness or mature tournament decision
        if: steps.recover.outputs.prediction_artifacts != '0' || steps.recover.outputs.ledger_found == '1'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evaluate_long_horizon_v5_forward_ledger.py \
            backend/data/cloud_shadow/long_horizon_v5/evidence/ledger.json \
            --output backend/data/cloud_shadow/long_horizon_v5/evidence/decision.json
      - name: Upload settlement diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-horizon-v5-evaluation-${{ github.run_id }}
          path: backend/data/cloud_shadow/long_horizon_v5/
          if-no-files-found: warn
          retention-days: 45
      - name: Upload cumulative paired evidence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-horizon-v5-evidence-ledger-${{ github.run_id }}
          path: backend/data/cloud_shadow/long_horizon_v5/evidence/ledger.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload score-blind readiness or mature decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-horizon-v5-forward-decision-${{ github.run_id }}
          path: backend/data/cloud_shadow/long_horizon_v5/evidence/decision.json
          if-no-files-found: warn
          retention-days: 90