name: Scheduler delivery canary
run-name: Scheduler canary ${{ github.event_name }} ${{ github.event.schedule || 'manual' }}

on:
  workflow_dispatch:
  schedule:
    # Lightweight repository-level liveness probe. This independent hourly
    # trigger also provides a second delivery path for regular-hours evidence.
    # The recovery gate aligns execution just after :35 ET, so a delayed GitHub
    # cron event can still produce a causally valid forward observation.
    - cron: "17 10-21 * * 1-5"

permissions:
  actions: read
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record scheduler delivery evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scheduler-canary
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "purpose": "repository_schedule_delivery_canary",
              "observed_at_utc": datetime.now(timezone.utc).isoformat(),
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "scheduled_cron": os.environ.get("SCHEDULE_CRON", ""),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "head_sha": os.environ["GITHUB_SHA"],
          }
          output = Path("scheduler-canary") / f"delivery-{payload['run_id']}.json"
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(output)
          PY
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}

      - name: Upload immutable canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-delivery-canary-${{ github.run_id }}
          path: scheduler-canary/*.json
          if-no-files-found: error
          retention-days: 7

  regular-recovery-gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      ready: ${{ steps.align.outputs.ready }}
    steps:
      - name: Align independent recovery path just after minute 35
        id: align
        shell: bash
        run: |
          set -euo pipefail
          minute=$(date -u +%M)
          second=$(date -u +%S)

          # New York and UTC differ only by whole hours, so the minute is the
          # same in both zones. If this hourly canary arrived before :36, wait
          # until :36. If it arrived after :36, run immediately. A late event
          # near the top of the next hour waits for that hour's :36 checkpoint.
          if [ "$minute" -le 35 ]; then
            wait_seconds=$(( (36 - 10#$minute) * 60 - 10#$second ))
            if [ "$wait_seconds" -gt 0 ]; then
              echo "Waiting ${wait_seconds}s for the :36 recovery checkpoint"
              sleep "$wait_seconds"
            fi
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  regular-hours-recovery:
    needs: regular-recovery-gate
    if: needs.regular-recovery-gate.outputs.ready == 'true'
    uses: ./.github/workflows/regular-hours-v3-1-cloud-shadow.yml
    secrets: inherit
