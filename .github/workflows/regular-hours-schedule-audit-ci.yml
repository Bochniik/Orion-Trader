name: Regular-hours schedule audit CI

on:
  pull_request:
    paths:
      - "scripts/audit_regular_hours_schedule_delivery.py"
      - "scripts/test_regular_hours_schedule_delivery_audit.py"
      - "scripts/reconcile_regular_hours_schedule_delivery.py"
      - "scripts/test_regular_hours_schedule_reconciliation.py"
      - "scripts/audit_regular_hours_slot_evidence_health.py"
      - "scripts/test_regular_hours_slot_evidence_health.py"
      - "scripts/build_regular_hours_operational_acceptance.py"
      - "scripts/test_regular_hours_operational_acceptance.py"
      - ".github/workflows/regular-hours-schedule-audit-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile audit scripts
        run: python -m py_compile scripts/audit_regular_hours_schedule_delivery.py scripts/test_regular_hours_schedule_delivery_audit.py scripts/reconcile_regular_hours_schedule_delivery.py scripts/test_regular_hours_schedule_reconciliation.py scripts/audit_regular_hours_slot_evidence_health.py scripts/test_regular_hours_slot_evidence_health.py scripts/build_regular_hours_operational_acceptance.py scripts/test_regular_hours_operational_acceptance.py
      - name: Run schedule audit regression tests
        working-directory: scripts
        run: python -m unittest -v test_regular_hours_schedule_delivery_audit.py test_regular_hours_schedule_reconciliation.py test_regular_hours_slot_evidence_health.py test_regular_hours_operational_acceptance.py
