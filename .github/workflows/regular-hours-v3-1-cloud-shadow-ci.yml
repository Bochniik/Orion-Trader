name: Regular-hours V3.1 cloud shadow CI

on:
  pull_request:
    paths:
      - "scripts/run_regular_hours_v3_1_cloud_shadow.py"
      - "scripts/audit_regular_hours_schedule_delivery.py"
      - "scripts/nyse_session_calendar.py"
      - "backend/tests/test_nyse_session_calendar.py"
      - "backend/tests/test_regular_hours_v3_1_cloud_shadow.py"
      - "backend/tests/test_regular_hours_nyse_session_gate.py"
      - "backend/tests/test_regular_hours_schedule_delivery_audit.py"
      - "backend/tests/test_regular_hours_timestamp_provenance.py"
      - "backend/tests/test_regular_hours_evidence_retention.py"
      - ".github/workflows/regular-hours-v3-1-cloud-shadow*.yml"
      - "backend/app/services/intraday_probability_*"
      - "backend/requirements.txt"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest
      - name: Compile regular-hours cloud shadow path
        run: |
          python -m py_compile scripts/run_regular_hours_v3_1_cloud_shadow.py
          python -m py_compile scripts/audit_regular_hours_schedule_delivery.py
          python -m py_compile scripts/nyse_session_calendar.py
          python -m py_compile backend/app/services/intraday_probability_runtime_v3_1.py
          python -m py_compile backend/app/services/intraday_probability_ensemble_engine.py
          python -m py_compile backend/app/services/intraday_probability_calibration_v3_1.py
      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            backend/tests/test_nyse_session_calendar.py \
            backend/tests/test_regular_hours_v3_1_cloud_shadow.py \
            backend/tests/test_regular_hours_nyse_session_gate.py \
            backend/tests/test_regular_hours_schedule_delivery_audit.py \
            backend/tests/test_regular_hours_timestamp_provenance.py \
            backend/tests/test_regular_hours_evidence_retention.py
