name: Premarket synthetic learning validation

on:
  pull_request:
    paths:
      - "scripts/simulate_premarket_market.py"
      - "scripts/run_premarket_synthetic_learning.py"
      - "backend/tests/test_premarket_synthetic_simulator.py"
      - "backend/tests/test_premarket_synthetic_learning.py"
      - ".github/workflows/premarket-synthetic-learning.yml"
      - ".github/workflows/premarket-synthetic-learning-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install numpy==2.5.1 pandas==3.0.3 pytest
      - name: Compile synthetic premarket research modules
        env:
          PYTHONPATH: backend
        run: |
          python -m py_compile scripts/simulate_premarket_market.py scripts/run_premarket_synthetic_learning.py
      - name: Run synthetic premarket regression tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q backend/tests/test_premarket_synthetic_simulator.py backend/tests/test_premarket_synthetic_learning.py
