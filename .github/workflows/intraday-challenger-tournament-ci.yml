name: Intraday challenger tournament CI

on:
  pull_request:
    paths:
      - "backend/evals/intraday_challenger_tournament.py"
      - "backend/evals/benchmark_intraday_challenger_v4.py"
      - "backend/app/services/intraday_probability_challenger_v4.py"
      - "scripts/run_intraday_v4_benchmark_evidence.py"
      - "backend/tests/test_intraday_challenger_tournament.py"
      - "backend/tests/test_intraday_probability_challenger_v4.py"
      - "backend/tests/test_benchmark_intraday_challenger_v4.py"
      - "backend/tests/test_run_intraday_v4_benchmark_evidence.py"
      - "backend/tests/test_frozen_intraday_v4_benchmark_workflow.py"
      - ".github/workflows/intraday-challenger-tournament-ci.yml"
      - ".github/workflows/frozen-intraday-v4-benchmark.yml"
      - "ENGINE_RESEARCH_LOG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tournament-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pytest
      - name: Compile challenger and tournament evaluators
        run: |
          python -m py_compile backend/evals/intraday_challenger_tournament.py
          python -m py_compile backend/evals/benchmark_intraday_challenger_v4.py
          python -m py_compile backend/app/services/intraday_probability_challenger_v4.py
          python -m py_compile scripts/run_intraday_v4_benchmark_evidence.py
      - name: Run focused regression tests
        run: |
          cd backend
          python -m pytest -q tests/test_intraday_challenger_tournament.py tests/test_intraday_probability_challenger_v4.py tests/test_benchmark_intraday_challenger_v4.py tests/test_run_intraday_v4_benchmark_evidence.py tests/test_frozen_intraday_v4_benchmark_workflow.py
