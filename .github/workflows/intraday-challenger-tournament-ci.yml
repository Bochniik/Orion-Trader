name: Intraday challenger tournament CI

on:
  pull_request:
    paths:
      - "backend/evals/intraday_challenger_tournament.py"
      - "backend/evals/specialist_engine_tournament.py"
      - "backend/evals/specialist_universe_v1.json"
      - "backend/evals/long_horizon_challenger_gate.py"
      - "backend/evals/benchmark_intraday_challenger_v4.py"
      - "backend/evals/benchmark_intraday_long_horizon_v5.py"
      - "backend/evals/audit_long_horizon_screening_protocol.py"
      - "backend/evals/diagnose_intraday_v4_failure.py"
      - "backend/evals/adaptive_research_error_diagnostics.py"
      - "backend/evals/adaptive_challenger_registry.py"
      - "backend/app/services/intraday_probability_challenger_v4.py"
      - "backend/app/services/intraday_probability_long_horizon_challenger_v5.py"
      - "scripts/build_specialist_forward_dataset.py"
      - "scripts/run_intraday_v4_benchmark_evidence.py"
      - "scripts/run_intraday_long_horizon_v5_benchmark_evidence.py"
      - "scripts/evaluate_long_horizon_v5_forward_ledger.py"
      - "backend/tests/test_intraday_challenger_tournament.py"
      - "backend/tests/test_specialist_engine_tournament.py"
      - "backend/tests/test_build_specialist_forward_dataset.py"
      - "backend/tests/test_long_horizon_challenger_gate.py"
      - "backend/tests/test_long_horizon_v5_forward_ledger.py"
      - "backend/tests/test_intraday_probability_challenger_v4.py"
      - "backend/tests/test_intraday_probability_long_horizon_challenger_v5.py"
      - "backend/tests/test_benchmark_intraday_challenger_v4.py"
      - "backend/tests/test_benchmark_intraday_long_horizon_v5.py"
      - "backend/tests/test_audit_long_horizon_screening_protocol.py"
      - "backend/tests/test_diagnose_intraday_v4_failure.py"
      - "backend/tests/test_adaptive_research_error_diagnostics.py"
      - "backend/tests/test_adaptive_challenger_registry.py"
      - "backend/tests/test_run_intraday_v4_benchmark_evidence.py"
      - "backend/tests/test_run_intraday_long_horizon_v5_benchmark_evidence.py"
      - "backend/tests/test_frozen_intraday_v4_benchmark_workflow.py"
      - "backend/tests/test_frozen_intraday_v5_benchmark_workflow.py"
      - ".github/workflows/intraday-challenger-tournament-ci.yml"
      - ".github/workflows/specialist-forward-readiness.yml"
      - ".github/workflows/frozen-intraday-v4-benchmark.yml"
      - ".github/workflows/frozen-intraday-v5-benchmark.yml"
      - ".github/workflows/long-horizon-v5-evidence-cycle.yml"
      - "ENGINE_RESEARCH_LOG.md"
      - "docs/research/SPECIALIST_ENGINE_TOURNAMENT.md"
      - "docs/research/V4_FAILURE_DIAGNOSTIC.md"
      - "docs/research/V5_SCREENING_PROTOCOL_AUDIT.md"
      - "docs/research/LONG_HORIZON_CHALLENGER_PROTOCOL.md"
      - "docs/research/LONG_HORIZON_V5_FORWARD_SHADOW.md"
      - "docs/research/ADAPTIVE_RESEARCH_LOOP.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tournament-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pytest
      - name: Compile challenger and tournament evaluators
        run: |
          python -m py_compile backend/evals/intraday_challenger_tournament.py
          python -m py_compile backend/evals/specialist_engine_tournament.py
          python -m py_compile backend/evals/long_horizon_challenger_gate.py
          python -m py_compile backend/evals/benchmark_intraday_challenger_v4.py
          python -m py_compile backend/evals/benchmark_intraday_long_horizon_v5.py
          python -m py_compile backend/evals/audit_long_horizon_screening_protocol.py
          python -m py_compile backend/evals/diagnose_intraday_v4_failure.py
          python -m py_compile backend/evals/adaptive_research_error_diagnostics.py
          python -m py_compile backend/evals/adaptive_challenger_registry.py
          python -m py_compile backend/app/services/intraday_probability_challenger_v4.py
          python -m py_compile backend/app/services/intraday_probability_long_horizon_challenger_v5.py
          python -m py_compile scripts/build_specialist_forward_dataset.py
          python -m py_compile scripts/run_intraday_v4_benchmark_evidence.py
          python -m py_compile scripts/run_intraday_long_horizon_v5_benchmark_evidence.py
          python -m py_compile scripts/evaluate_long_horizon_v5_forward_ledger.py
      - name: Run focused regression tests
        run: |
          cd backend
          python -m pytest -q tests/test_intraday_challenger_tournament.py tests/test_specialist_engine_tournament.py tests/test_build_specialist_forward_dataset.py tests/test_long_horizon_challenger_gate.py tests/test_long_horizon_v5_forward_ledger.py tests/test_intraday_probability_challenger_v4.py tests/test_intraday_probability_long_horizon_challenger_v5.py tests/test_benchmark_intraday_challenger_v4.py tests/test_benchmark_intraday_long_horizon_v5.py tests/test_audit_long_horizon_screening_protocol.py tests/test_diagnose_intraday_v4_failure.py tests/test_adaptive_research_error_diagnostics.py tests/test_adaptive_challenger_registry.py tests/test_run_intraday_v4_benchmark_evidence.py tests/test_run_intraday_long_horizon_v5_benchmark_evidence.py tests/test_frozen_intraday_v4_benchmark_workflow.py tests/test_frozen_intraday_v5_benchmark_workflow.py
