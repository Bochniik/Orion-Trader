name: Intraday challenger tournament CI

on:
  pull_request:
    paths:
      - "backend/evals/intraday_challenger_tournament.py"
      - "backend/tests/test_intraday_challenger_tournament.py"
      - ".github/workflows/intraday-challenger-tournament-ci.yml"
      - "ENGINE_RESEARCH_LOG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tournament-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Compile tournament evaluator
        run: python -m py_compile backend/evals/intraday_challenger_tournament.py
      - name: Run focused regression tests
        run: python -m pytest -q backend/tests/test_intraday_challenger_tournament.py
