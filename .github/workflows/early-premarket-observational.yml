name: Early premarket observational collection
run-name: Early Premarket observation ${{ github.event_name }} ${{ github.event.schedule || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated symbols"
        required: false
        default: "AAPL MSFT NVDA AMZN META GOOGL TSLA AMD SPY QQQ"
  schedule:
    # Broad DST-safe envelope. The resolver activates only the preregistered
    # 04:05/04:35/05:05/05:35/06:05/06:35 America/New_York slots and rejects
    # inactive EDT/EST duplicates and deliveries more than 20 minutes late.
    - cron: "5,35 8-11 * * 1-5"

permissions:
  contents: read

concurrency:
  group: early-premarket-observational-collection
  cancel-in-progress: false

jobs:
  collect-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve early premarket observation slot
        id: target
        shell: bash
        run: |
          python scripts/resolve_early_premarket_observation.py --github-output "$GITHUB_OUTPUT"

      - name: Report inactive schedule slot
        if: steps.target.outputs.active != 'true'
        run: |
          echo "Skipping inactive early-premarket slot: ${{ steps.target.outputs.reason }}"
          echo "Resolved slot: ${{ steps.target.outputs.slot }}"

      - uses: actions/setup-python@v5
        if: steps.target.outputs.active == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install focused collection dependencies
        if: steps.target.outputs.active == 'true'
        run: python -m pip install httpx python-dotenv

      - name: Verify existing Alpaca data credentials
        if: steps.target.outputs.active == 'true'
        shell: bash
        run: |
          if [ -z "$ALPACA_API_KEY_ID" ] || [ -z "$ALPACA_API_SECRET_KEY" ]; then
            echo "Missing repository secrets ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY." >&2
            exit 2
          fi

      - name: Collect raw early-premarket observation
        if: steps.target.outputs.active == 'true'
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          SYMBOLS="${{ github.event.inputs.symbols }}"
          if [ -z "$SYMBOLS" ]; then
            SYMBOLS="AAPL MSFT NVDA AMZN META GOOGL TSLA AMD SPY QQQ"
          fi
          OUT_DIR="backend/data/cloud_shadow/early_premarket_observational"
          mkdir -p "$OUT_DIR"
          CSV="$OUT_DIR/observation-${{ steps.target.outputs.slot }}-${{ github.run_id }}.csv"
          COLLECTION_STARTED_AT_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/collect_alpaca_extended_history.py \
            --symbols $SYMBOLS \
            --start "${{ steps.target.outputs.session_date }}" \
            --end "${{ steps.target.outputs.session_date }}" \
            --feed iex \
            --batch-size 10 \
            --chunk-days 1 \
            --output "$CSV"
          COLLECTION_COMPLETED_AT_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "csv=$CSV" >> "$GITHUB_OUTPUT"
          echo "started=$COLLECTION_STARTED_AT_UTC" >> "$GITHUB_OUTPUT"
          echo "completed=$COLLECTION_COMPLETED_AT_UTC" >> "$GITHUB_OUTPUT"

      - name: Write observational-only provenance
        if: steps.target.outputs.active == 'true'
        shell: bash
        env:
          CSV_PATH: ${{ steps.collect.outputs.csv }}
          COLLECTION_STARTED_AT_UTC: ${{ steps.collect.outputs.started }}
          COLLECTION_COMPLETED_AT_UTC: ${{ steps.collect.outputs.completed }}
          TARGET_SLOT: ${{ steps.target.outputs.slot }}
          TARGET_ET: ${{ steps.target.outputs.target_et }}
          TARGET_UTC: ${{ steps.target.outputs.target_utc }}
          SCHEDULE_LAG_MINUTES: ${{ steps.target.outputs.lag_minutes }}
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["CSV_PATH"])
          rows = list(csv.DictReader(path.open("r", encoding="utf-8", newline="")))
          timestamps = sorted(str(row.get("timestamp") or "") for row in rows if row.get("timestamp"))
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          metadata = {
              "contract": "orion-early-premarket-observational-v1",
              "observational_only": True,
              "premarket_v5_forward_eligible": False,
              "issue_3_forward_cohort_eligible": False,
              "order_submission_enabled": False,
              "source": "alpaca_stock_bars_v2",
              "feed": "iex",
              "target_slot_et": os.environ["TARGET_SLOT"],
              "target_as_of_et": os.environ["TARGET_ET"],
              "target_as_of_utc": os.environ["TARGET_UTC"],
              "schedule_delivery_lag_minutes": float(os.environ["SCHEDULE_LAG_MINUTES"]),
              "collection_started_at_utc": os.environ["COLLECTION_STARTED_AT_UTC"],
              "collection_completed_at_utc": os.environ["COLLECTION_COMPLETED_AT_UTC"],
              "github_event_name": os.environ.get("GITHUB_EVENT_NAME"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
              "github_head_sha": os.environ.get("GITHUB_SHA"),
              "row_count": len(rows),
              "first_observed_bar_utc": timestamps[0] if timestamps else None,
              "last_observed_bar_utc": timestamps[-1] if timestamps else None,
              "csv_sha256": digest,
              "downstream_causal_cutoff_required": True,
              "downstream_causal_cutoff": os.environ["TARGET_UTC"],
              "notes": "Raw observation may include bars acquired after the target when GitHub scheduling is delayed; downstream research must trim timestamps strictly at target_as_of_utc.",
          }
          meta_path = path.with_suffix(".observation.json")
          meta_path.write_text(json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          if not rows:
              raise SystemExit("No early-premarket bars were collected; refusing an empty observation artifact.")
          print(json.dumps({"status": "observed", "row_count": len(rows), "csv_sha256": digest}, sort_keys=True))
          PY

      - name: Upload immutable observational evidence
        if: always() && steps.target.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: early-premarket-observation-${{ steps.target.outputs.slot }}-${{ github.run_id }}
          path: |
            backend/data/cloud_shadow/early_premarket_observational/*.csv
            backend/data/cloud_shadow/early_premarket_observational/*.manifest.json
            backend/data/cloud_shadow/early_premarket_observational/*.observation.json
          if-no-files-found: warn
          retention-days: 90
