name: Long-horizon V5 benchmark alignment CI

on:
  pull_request:
    paths:
      - "backend/app/services/intraday_probability_long_horizon_v5_forward.py"
      - "backend/tests/test_long_horizon_v5_benchmark_alignment.py"
      - ".github/workflows/long-horizon-v5-benchmark-alignment-ci.yml"
      - "docs/research/LONG_HORIZON_V5_BENCHMARK_ALIGNMENT.md"

permissions:
  contents: read

jobs:
  benchmark-alignment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest
      - name: Compile forward adapter
        run: python -m py_compile backend/app/services/intraday_probability_long_horizon_v5_forward.py
      - name: Test benchmark timestamp alignment guard
        run: |
          cd backend
          python -m pytest -q tests/test_long_horizon_v5_benchmark_alignment.py
