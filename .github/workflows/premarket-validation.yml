name: Premarket validation

on:
  pull_request:
    paths:
      - "scripts/audit_premarket_dataset_readiness.py"
      - "scripts/audit_premarket_dataset_provenance.py"
      - "scripts/run_premarket_v5_decision_preflight.py"
      - "scripts/collect_alpaca_extended_history.py"
      - "scripts/resolve_early_premarket_observation.py"
      - "scripts/resolve_premarket_v5_snapshot.py"
      - "scripts/guard_premarket_v5_recovery.py"
      - "scripts/collect_premarket_v5_actions_evidence.py"
      - "scripts/audit_premarket_v5_schedule_delivery.py"
      - "scripts/audit_premarket_v5_collection_health.py"
      - "scripts/audit_premarket_v5_evidence_health.py"
      - "scripts/audit_premarket_v5_horizon_evidence_health.py"
      - "scripts/audit_premarket_v5_forward_readiness.py"
      - "scripts/build_premarket_training_dataset_v2.py"
      - "scripts/run_premarket_v5_evidence_pipeline.py"
      - "scripts/run_premarket_v5_validation.py"
      - "scripts/simulate_premarket_market.py"
      - "scripts/run_premarket_synthetic_learning.py"
      - "scripts/evaluate_premarket_v5_research_gate.py"
      - "scripts/premarket_directional_v4_common.py"
      - "scripts/premarket_directional_v5_common.py"
      - "scripts/train_premarket_hierarchical.py"
      - "scripts/validate_premarket_directional_v5_*.py"
      - "backend/tests/test_premarket_*.py"
      - "backend/tests/test_collect_alpaca_extended_history.py"
      - "backend/tests/test_resolve_early_premarket_observation.py"
      - "docs/research/PREMARKET_V5_DECISION_PREFLIGHT.md"
      - "docs/research/EARLY_PREMARKET_OBSERVATIONAL_COLLECTION.md"
      - "docs/research/PREMARKET_V5_EVIDENCE_OPERATIONS_CI.md"
      - ".github/workflows/early-premarket-observational.yml"
      - ".github/workflows/premarket-v5-cloud-shadow.yml"
      - ".github/workflows/premarket-v5-evidence-health.yml"
      - ".github/workflows/premarket-synthetic-learning.yml"
      - ".github/workflows/premarket-validation.yml"

permissions:
  contents: read

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.5.1 pandas==3.0.3 pytest httpx python-dotenv

      - name: Compile premarket validation modules
        run: |
          python -m py_compile \
            scripts/audit_premarket_dataset_readiness.py \
            scripts/audit_premarket_dataset_provenance.py \
            scripts/run_premarket_v5_decision_preflight.py \
            scripts/collect_alpaca_extended_history.py \
            scripts/resolve_early_premarket_observation.py \
            scripts/resolve_premarket_v5_snapshot.py \
            scripts/guard_premarket_v5_recovery.py \
            scripts/collect_premarket_v5_actions_evidence.py \
            scripts/audit_premarket_v5_schedule_delivery.py \
            scripts/audit_premarket_v5_collection_health.py \
            scripts/audit_premarket_v5_evidence_health.py \
            scripts/audit_premarket_v5_horizon_evidence_health.py \
            scripts/audit_premarket_v5_forward_readiness.py \
            scripts/build_premarket_training_dataset_v2.py \
            scripts/run_premarket_v5_evidence_pipeline.py \
            scripts/run_premarket_v5_validation.py \
            scripts/simulate_premarket_market.py \
            scripts/run_premarket_synthetic_learning.py \
            scripts/evaluate_premarket_v5_research_gate.py \
            scripts/premarket_directional_v4_common.py \
            scripts/premarket_directional_v5_common.py \
            scripts/train_premarket_hierarchical.py \
            scripts/validate_premarket_directional_v5_walkforward.py \
            scripts/validate_premarket_directional_v5_event_nested.py \
            backend/app/services/premarket_live_engine.py \
            backend/app/services/premarket_continuous_scheduler.py

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            backend/tests/test_collect_alpaca_extended_history.py \
            backend/tests/test_resolve_early_premarket_observation.py \
            backend/tests/test_premarket_dataset_readiness.py \
            backend/tests/test_premarket_dataset_provenance.py \
            backend/tests/test_premarket_v5_decision_preflight.py \
            backend/tests/test_premarket_v5_actions_evidence.py \
            backend/tests/test_premarket_v5_schedule_delivery.py \
            backend/tests/test_premarket_v5_collection_health.py \
            backend/tests/test_premarket_v5_evidence_health.py \
            backend/tests/test_premarket_v5_horizon_evidence_health.py \
            backend/tests/test_premarket_v5_forward_acquisition.py \
            backend/tests/test_premarket_v5_snapshot_schedule.py \
            backend/tests/test_premarket_v5_recovery_guard.py \
            backend/tests/test_premarket_training_dataset_lineage.py \
            backend/tests/test_premarket_validation_report_lineage.py \
            backend/tests/test_premarket_v5_evidence_pipeline.py \
            backend/tests/test_premarket_v5_research_gate.py \
            backend/tests/test_premarket_directional_v4_features.py \
            backend/tests/test_premarket_directional_v5_validation.py \
            backend/tests/test_premarket_live_engine.py \
            backend/tests/test_premarket_continuous_scheduler.py \
            backend/tests/test_premarket_synthetic_simulator.py \
            backend/tests/test_premarket_synthetic_learning.py
