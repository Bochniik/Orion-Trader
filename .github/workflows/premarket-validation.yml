name: Premarket validation

on:
  pull_request:
    paths:
      - "scripts/audit_premarket_dataset_readiness.py"
      - "scripts/audit_premarket_dataset_provenance.py"
      - "scripts/run_premarket_v5_decision_preflight.py"
      - "scripts/collect_alpaca_extended_history.py"
      - "scripts/build_premarket_training_dataset_v2.py"
      - "scripts/run_premarket_v5_evidence_pipeline.py"
      - "scripts/run_premarket_v5_validation.py"
      - "scripts/evaluate_premarket_v5_research_gate.py"
      - "scripts/premarket_directional_v4_common.py"
      - "scripts/premarket_directional_v5_common.py"
      - "scripts/train_premarket_hierarchical.py"
      - "scripts/validate_premarket_directional_v5_*.py"
      - "backend/tests/test_premarket_*.py"
      - "backend/tests/test_collect_alpaca_extended_history.py"
      - "docs/research/PREMARKET_V5_DECISION_PREFLIGHT.md"
      - ".github/workflows/premarket-validation.yml"

permissions:
  contents: read

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.5.1 pandas==3.0.3 pytest httpx python-dotenv

      - name: Compile premarket validation modules
        run: |
          python -m py_compile \
            scripts/audit_premarket_dataset_readiness.py \
            scripts/audit_premarket_dataset_provenance.py \
            scripts/run_premarket_v5_decision_preflight.py \
            scripts/collect_alpaca_extended_history.py \
            scripts/build_premarket_training_dataset_v2.py \
            scripts/run_premarket_v5_evidence_pipeline.py \
            scripts/run_premarket_v5_validation.py \
            scripts/evaluate_premarket_v5_research_gate.py \
            scripts/premarket_directional_v4_common.py \
            scripts/premarket_directional_v5_common.py \
            scripts/train_premarket_hierarchical.py \
            scripts/validate_premarket_directional_v5_walkforward.py \
            scripts/validate_premarket_directional_v5_event_nested.py

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            backend/tests/test_collect_alpaca_extended_history.py \
            backend/tests/test_premarket_dataset_readiness.py \
            backend/tests/test_premarket_dataset_provenance.py \
            backend/tests/test_premarket_v5_decision_preflight.py \
            backend/tests/test_premarket_training_dataset_lineage.py \
            backend/tests/test_premarket_validation_report_lineage.py \
            backend/tests/test_premarket_v5_evidence_pipeline.py \
            backend/tests/test_premarket_v5_research_gate.py \
            backend/tests/test_premarket_directional_v4_features.py \
            backend/tests/test_premarket_directional_v5_validation.py
