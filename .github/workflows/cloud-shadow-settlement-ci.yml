name: Cloud shadow settlement CI

on:
  pull_request:
    paths:
      - "scripts/evaluate_cloud_shadow_predictions.py"
      - "backend/tests/test_cloud_shadow_settlement_evaluator.py"
      - ".github/workflows/cloud-shadow-settlement-ci.yml"
      - "ENGINE_RESEARCH_LOG.md"
      - "backend/requirements.txt"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest
      - name: Compile evaluator
        run: python -m py_compile scripts/evaluate_cloud_shadow_predictions.py
      - name: Run focused settlement tests
        run: python -m pytest -q backend/tests/test_cloud_shadow_settlement_evaluator.py
