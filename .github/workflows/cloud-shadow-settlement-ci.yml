name: Cloud shadow settlement CI

on:
  pull_request:
    paths:
      - "scripts/evaluate_cloud_shadow_predictions.py"
      - "scripts/accumulate_cloud_shadow_evidence.py"
      - "scripts/collect_cloud_shadow_outcome_bars.py"
      - "backend/tests/test_cloud_shadow_settlement_evaluator.py"
      - "backend/tests/test_cloud_shadow_horizon_forward_guard.py"
      - "backend/tests/test_cloud_shadow_evidence_ledger.py"
      - "backend/tests/test_cloud_shadow_outcome_collector.py"
      - "backend/tests/test_regular_hours_timestamp_provenance.py"
      - ".github/workflows/cloud-shadow-settlement-ci.yml"
      - ".github/workflows/cloud-shadow-evidence-cycle.yml"
      - "ENGINE_RESEARCH_LOG.md"
      - "backend/requirements.txt"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest
      - name: Compile settlement pipeline
        run: |
          python -m py_compile scripts/evaluate_cloud_shadow_predictions.py
          python -m py_compile scripts/accumulate_cloud_shadow_evidence.py
          python -m py_compile scripts/collect_cloud_shadow_outcome_bars.py
      - name: Run focused settlement and evidence tests
        run: |
          python -m pytest -q backend/tests/test_cloud_shadow_settlement_evaluator.py
          python -m pytest -q backend/tests/test_cloud_shadow_horizon_forward_guard.py
          python -m pytest -q backend/tests/test_cloud_shadow_evidence_ledger.py
          python -m pytest -q backend/tests/test_cloud_shadow_outcome_collector.py
          python -m pytest -q backend/tests/test_regular_hours_timestamp_provenance.py
