name: Backend analytics core CI

on:
  pull_request:
    paths:
      - "backend/app/services/**"
      - "backend/evals/**"
      - "backend/tests/**"
      - ".github/workflows/backend-analytics-core-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/services/**"
      - "backend/evals/**"
      - "backend/tests/**"
      - ".github/workflows/backend-analytics-core-ci.yml"

permissions:
  contents: read

jobs:
  analytics-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Compile analytics modules
        run: python -m compileall -q backend/app/services backend/evals
      - name: Run dependency-light analytics regression tests
        shell: bash
        run: |
          mapfile -t tests < <(grep -L -E '(^|[[:space:]])(from|import)[[:space:]]+(fastapi|pandas|numpy|sklearn|scipy|yfinance|httpx|requests|alpaca|sqlalchemy|pydantic)' backend/tests/test_*.py || true)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No dependency-light analytics tests discovered; failing closed."
            exit 1
          fi
          printf 'Running %s dependency-light test files\n' "${#tests[@]}"
          python -m pytest -q "${tests[@]}"
