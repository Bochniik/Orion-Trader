name: Backend analytics regression

on:
  pull_request:
    paths:
      - "backend/evals/**"
      - "backend/tests/**"
      - ".github/analytics-regression-tests.txt"
      - ".github/workflows/backend-analytics-regression.yml"
  push:
    branches: [main]
    paths:
      - "backend/evals/**"
      - "backend/tests/**"
      - ".github/analytics-regression-tests.txt"
      - ".github/workflows/backend-analytics-regression.yml"

permissions:
  contents: read

jobs:
  analytics-regression:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Validate explicit regression manifest
        shell: pwsh
        run: |
          $tests = Get-Content .github/analytics-regression-tests.txt |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') }
          if (-not $tests -or $tests.Count -eq 0) {
            throw "Analytics regression manifest is empty"
          }
          foreach ($testPath in $tests) {
            if (-not (Test-Path -LiteralPath $testPath -PathType Leaf)) {
              throw "Manifest entry does not exist: $testPath"
            }
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP "orion-analytics-tests.txt"
          Set-Content -LiteralPath $manifestPath -Value $tests -Encoding utf8
      - name: Compile analytics evaluator
        run: python -m py_compile backend/evals/evaluate_directional_model.py
      - name: Run deterministic analytics regression suite
        shell: pwsh
        run: |
          $manifestPath = Join-Path $env:RUNNER_TEMP "orion-analytics-tests.txt"
          $tests = Get-Content -LiteralPath $manifestPath | Where-Object { $_ }
          python -m pytest @tests -q
