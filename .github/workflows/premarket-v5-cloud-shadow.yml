name: Premarket v5 cloud shadow
run-name: Premarket V5 ${{ github.event_name }} ${{ github.event.schedule || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated symbols"
        required: false
        default: "AAPL MSFT NVDA AMZN META GOOGL TSLA AMD SPY QQQ"
  schedule:
    # Frozen decision timestamps remain 06:45 / 08:00 / 09:15 ET.
    # Each primary slot has a fixed +10 minute recovery opportunity. Both scheduled
    # modes use the same score-blind idempotency guard, so delayed primary delivery
    # cannot create a duplicate after recovery has already produced valid evidence.
    # EDT primary/recovery slots.
    - cron: "45 10 * * 1-5"
    - cron: "55 10 * * 1-5"
    - cron: "0 12 * * 1-5"
    - cron: "10 12 * * 1-5"
    - cron: "15 13 * * 1-5"
    - cron: "25 13 * * 1-5"
    # EST primary/recovery slots.
    - cron: "45 11 * * 1-5"
    - cron: "55 11 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "10 13 * * 1-5"
    - cron: "15 14 * * 1-5"
    - cron: "25 14 * * 1-5"

permissions:
  actions: read
  contents: read

concurrency:
  group: premarket-v5-cloud-shadow
  cancel-in-progress: false

jobs:
  shadow-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve preregistered Premarket V5 snapshot
        id: target
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python scripts/resolve_premarket_v5_snapshot.py \
            --schedule-cron "$SCHEDULE_CRON" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report inactive DST slot
        if: steps.target.outputs.active != 'true'
        run: |
          echo "Skipping inactive Premarket V5 schedule slot: ${{ steps.target.outputs.reason }}"
          echo "Snapshot: ${{ steps.target.outputs.snapshot }}"
          echo "Mode: ${{ steps.target.outputs.mode }}"
          echo "Registered target: ${{ steps.target.outputs.as_of_et }}"

      - uses: actions/setup-python@v5
        if: steps.target.outputs.active == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Claim scheduled evidence slot idempotently
        id: claim
        if: steps.target.outputs.active == 'true' && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/guard_premarket_v5_recovery.py \
            --repository "$GITHUB_REPOSITORY" \
            --session "${{ steps.target.outputs.session }}" \
            --snapshot "${{ steps.target.outputs.snapshot }}" \
            --current-run-id "$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report idempotent scheduled skip
        if: steps.target.outputs.active == 'true' && github.event_name == 'schedule' && steps.claim.outputs.collect_allowed != 'true'
        run: |
          echo "Scheduled collection skipped: ${{ steps.claim.outputs.reason }}"
          echo "Existing run: ${{ steps.claim.outputs.blocking_run_id }}"
          echo "Existing artifact: ${{ steps.claim.outputs.blocking_artifact }}"

      - name: Install backend dependencies
        if: steps.target.outputs.active == 'true' && (github.event_name != 'schedule' || steps.claim.outputs.collect_allowed == 'true')
        run: python -m pip install -r backend/requirements.txt

      - name: Verify cloud credentials are configured
        if: steps.target.outputs.active == 'true' && (github.event_name != 'schedule' || steps.claim.outputs.collect_allowed == 'true')
        shell: bash
        run: |
          if [ -z "$ALPACA_API_KEY_ID" ] || [ -z "$ALPACA_API_SECRET_KEY" ]; then
            echo "Missing repository secrets ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY." >&2
            exit 2
          fi

      - name: Run and attest premarket v5 shadow prediction
        if: steps.target.outputs.active == 'true' && (github.event_name != 'schedule' || steps.claim.outputs.collect_allowed == 'true')
        shell: bash
        run: |
          SYMBOLS="${{ github.event.inputs.symbols }}"
          if [ -z "$SYMBOLS" ]; then
            SYMBOLS="AAPL MSFT NVDA AMZN META GOOGL TSLA AMD SPY QQQ"
          fi
          OUTPUT="backend/data/cloud_shadow/premarket_v5/prediction-${{ steps.target.outputs.snapshot }}-${{ github.run_id }}.json"
          COLLECTION_STARTED_AT_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Collecting ${{ steps.target.outputs.snapshot }} Premarket V5 ${{ steps.target.outputs.mode }} snapshot for ${{ steps.target.outputs.as_of_et }}"
          python scripts/run_premarket_v5_cloud_shadow.py \
            --symbols $SYMBOLS \
            --as-of "${{ steps.target.outputs.as_of }}" \
            --lookback-days 120 \
            --feed iex \
            --output "$OUTPUT"
          COLLECTION_COMPLETED_AT_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/finalize_premarket_v5_forward_artifact.py \
            --input "$OUTPUT" \
            --collection-started-at "$COLLECTION_STARTED_AT_UTC" \
            --collection-completed-at "$COLLECTION_COMPLETED_AT_UTC" \
            --event-name "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-head-sha "$GITHUB_SHA"

      - name: Upload immutable shadow evidence
        if: always() && steps.target.outputs.active == 'true' && (github.event_name != 'schedule' || steps.claim.outputs.collect_allowed == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: premarket-v5-shadow-${{ steps.target.outputs.snapshot }}-${{ github.run_id }}
          path: |
            backend/data/cloud_shadow/premarket_v5/*.json
            backend/data/cloud_shadow/premarket_v5/*.manifest.json
          if-no-files-found: warn
          # Issue #3 needs at least 55 distinct sessions (40 train + 10 calibration + 5 test).
          # 90 days preserves the minimum 11-week weekday geometry plus holiday/missing-run slack.
          retention-days: 90
