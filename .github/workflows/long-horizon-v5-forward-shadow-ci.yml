name: Long-horizon V5 forward shadow CI

on:
  pull_request:
    paths:
      - "backend/app/services/intraday_probability_long_horizon_v5_forward.py"
      - "scripts/run_long_horizon_v5_paired_cloud_shadow.py"
      - "scripts/settle_long_horizon_v5_shadow.py"
      - "scripts/accumulate_cloud_shadow_evidence.py"
      - "scripts/audit_long_horizon_v5_collection_capacity.py"
      - "scripts/audit_long_horizon_v5_collection_health.py"
      - "scripts/validate_long_horizon_v5_artifact_origin.py"
      - "scripts/validate_long_horizon_v5_ledger_origin.py"
      - "scripts/sort_long_horizon_v5_recovery_artifacts.py"
      - "backend/tests/test_cloud_shadow_evidence_ledger.py"
      - "backend/tests/test_long_horizon_v5_forward_shadow.py"
      - "backend/tests/test_long_horizon_v5_settlement_score_blind.py"
      - "backend/tests/test_long_horizon_v5_collection_capacity.py"
      - "backend/tests/test_long_horizon_v5_collection_health.py"
      - "backend/tests/test_long_horizon_v5_artifact_origin.py"
      - "backend/tests/test_long_horizon_v5_ledger_origin.py"
      - ".github/workflows/long-horizon-v5-cloud-shadow.yml"
      - ".github/workflows/long-horizon-v5-evidence-cycle.yml"
      - ".github/workflows/long-horizon-v5-forward-shadow-ci.yml"
      - "docs/research/LONG_HORIZON_V5_FORWARD_SHADOW.md"
      - "docs/research/LONG_HORIZON_V5_LEDGER_PROVENANCE.md"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest
      - name: Compile forward-shadow components
        run: |
          python -m py_compile backend/app/services/intraday_probability_long_horizon_v5_forward.py
          python -m py_compile scripts/run_long_horizon_v5_paired_cloud_shadow.py
          python -m py_compile scripts/settle_long_horizon_v5_shadow.py
          python -m py_compile scripts/accumulate_cloud_shadow_evidence.py
          python -m py_compile scripts/audit_long_horizon_v5_collection_capacity.py
          python -m py_compile scripts/audit_long_horizon_v5_collection_health.py
          python -m py_compile scripts/validate_long_horizon_v5_artifact_origin.py
          python -m py_compile scripts/validate_long_horizon_v5_ledger_origin.py
          python -m py_compile scripts/sort_long_horizon_v5_recovery_artifacts.py
      - name: Test scoped deterministic recovery artifact validation and ordering
        run: |
          python - <<'PY'
          from scripts.sort_long_horizon_v5_recovery_artifacts import sort_artifact_rows

          sha = "a" * 40
          old = f"100\tlong-horizon-v5-evidence-ledger-10\t2026-09-11T15:40:00Z\t2026-12-10T15:40:00Z\t10\t{sha}"
          new = f"300\tlong-horizon-v5-evidence-ledger-30\t2026-09-13T15:40:00Z\t2026-12-12T15:40:00Z\t30\t{sha}"
          mid = f"200\tlong-horizon-v5-paired-shadow-20\t2026-09-12T15:40:00Z\t2026-10-27T15:40:00Z\t20\t{sha}"
          assert sort_artifact_rows([old, new, mid]) == [new, mid, old]

          unrelated = "bad\tfrontend-build\tnot-a-time\tnot-a-time\tbad\tnot-a-sha"
          assert sort_artifact_rows([unrelated, old]) == [old]

          shortened_prediction = (
              f"201\tlong-horizon-v5-paired-shadow-20\t2026-09-12T15:40:00Z\t"
              f"2026-10-26T15:40:00Z\t20\t{sha}"
          )
          shortened_ledger = (
              f"301\tlong-horizon-v5-evidence-ledger-30\t2026-09-13T15:40:00Z\t"
              f"2026-12-11T15:40:00Z\t30\t{sha}"
          )
          duplicate_prediction_a = (
              f"401\tlong-horizon-v5-paired-shadow-40\t2026-09-12T15:40:00Z\t"
              f"2026-10-27T15:40:00Z\t40\t{sha}"
          )
          duplicate_prediction_b = (
              f"402\tlong-horizon-v5-paired-shadow-40\t2026-09-12T15:41:00Z\t"
              f"2026-10-27T15:41:00Z\t40\t{sha}"
          )
          duplicate_ledger_a = (
              f"501\tlong-horizon-v5-evidence-ledger-50\t2026-09-12T15:40:00Z\t"
              f"2026-12-11T15:40:00Z\t50\t{sha}"
          )
          duplicate_ledger_b = (
              f"502\tlong-horizon-v5-evidence-ledger-50\t2026-09-12T15:41:00Z\t"
              f"2026-12-11T15:41:00Z\t50\t{sha}"
          )
          relevant_name = "long-horizon-v5-paired-shadow-10"
          valid_expiry = "2026-10-28T15:40:00Z"
          bad_rows = (
              f"bad\t{relevant_name}\t2026-09-13T15:40:00Z\t{valid_expiry}\t10\t{sha}",
              f"1\t{relevant_name}\tnot-a-time\t{valid_expiry}\t10\t{sha}",
              f"1\t{relevant_name}\t2026-09-13T15:40:00Z\tnot-a-time\t10\t{sha}",
              f"1\t{relevant_name}\t2026-09-13T15:40:00Z\t2026-09-12T15:40:00Z\t10\t{sha}",
              f"1\t{relevant_name}\t2026-09-13T15:40:00Z\t{valid_expiry}\tbad\t{sha}",
              f"1\t{relevant_name}\t2026-09-13T15:40:00Z\t{valid_expiry}\t10\tnot-a-sha",
              f"1\t{relevant_name}\t2026-09-13T15:40:00Z\t{valid_expiry}",
              shortened_prediction,
              shortened_ledger,
          )
          for bad in bad_rows:
              try:
                  sort_artifact_rows([bad])
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"malformed or under-retained relevant artifact metadata was accepted: {bad}")

          for duplicate_pair in (
              [duplicate_prediction_a, duplicate_prediction_b],
              [duplicate_ledger_a, duplicate_ledger_b],
          ):
              try:
                  sort_artifact_rows(duplicate_pair)
              except ValueError as exc:
                  assert "Ambiguous duplicate recovery artifact" in str(exc)
              else:
                  raise AssertionError(f"duplicate recovery identity was accepted: {duplicate_pair}")

          same_run_different_types = [
              f"601\tlong-horizon-v5-paired-shadow-60\t2026-09-12T15:40:00Z\t2026-10-27T15:40:00Z\t60\t{sha}",
              f"602\tlong-horizon-v5-evidence-ledger-60\t2026-09-12T15:40:00Z\t2026-12-11T15:40:00Z\t60\t{sha}",
          ]
          assert len(sort_artifact_rows(same_run_different_types)) == 2
          PY
      - name: Verify workflow scopes and binds recovery metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/long-horizon-v5-evidence-cycle.yml').read_text(encoding='utf-8')
          assert 'startswith("long-horizon-v5-paired-shadow-")' in workflow
          assert 'startswith("long-horizon-v5-evidence-ledger-")' in workflow
          assert '.expires_at' in workflow
          assert '(.workflow_run.id // "")' in workflow
          assert '(.workflow_run.head_sha // "")' in workflow
          assert 'EXPIRES_AT' in workflow
          assert 'ARTIFACT_RUN_ID' in workflow
          assert 'ARTIFACT_HEAD_SHA' in workflow
          assert 'producing run mismatch' in workflow
          assert 'head SHA does not match producing run metadata' in workflow
          assert 'RUN_EVENT=$(jq -r' in workflow
          assert 'if [ "$RUN_EVENT" != "schedule" ]; then' in workflow
          assert 'Skipping non-forward long-horizon prediction artifact' in workflow
          event_filter = workflow.index('RUN_EVENT=$(jq -r')
          prediction_download = workflow.index('gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "/tmp/long-prediction-')
          assert event_filter < prediction_download
          PY
      - name: Run focused regression tests
        run: |
          cd backend
          python -m pytest -q \
            tests/test_intraday_probability_long_horizon_challenger_v5.py \
            tests/test_long_horizon_challenger_gate.py \
            tests/test_cloud_shadow_evidence_ledger.py \
            tests/test_long_horizon_v5_forward_shadow.py \
            tests/test_long_horizon_v5_settlement_score_blind.py \
            tests/test_long_horizon_v5_collection_capacity.py \
            tests/test_long_horizon_v5_collection_health.py \
            tests/test_long_horizon_v5_artifact_origin.py \
            tests/test_long_horizon_v5_ledger_origin.py
