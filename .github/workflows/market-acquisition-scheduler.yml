name: Market acquisition scheduler
run-name: Market acquisition ${{ github.event_name }} ${{ github.event.schedule || 'manual' }}

on:
  issue_comment:
    types: [created]
  schedule:
    # Session-open acquisition probes. Register EDT + EST UTC equivalents;
    # market-session-data-cloud gates on America/New_York wall clock.
    - cron: "7 8 * * 1-5"
    - cron: "7 9 * * 1-5"
    - cron: "37 13 * * 1-5"
    - cron: "37 14 * * 1-5"
    - cron: "7 20 * * 1-5"
    - cron: "7 21 * * 1-5"
    # Premarket V5 frozen decision timestamps 06:45 / 08:00 / 09:15 ET
    # plus the existing +10 minute recovery opportunities. Both EDT and EST
    # registrations are retained; the Premarket resolver activates only the
    # timezone-correct slot.
    - cron: "45 10 * * 1-5"
    - cron: "55 10 * * 1-5"
    - cron: "0 12 * * 1-5"
    - cron: "10 12 * * 1-5"
    - cron: "15 13 * * 1-5"
    - cron: "25 13 * * 1-5"
    - cron: "45 11 * * 1-5"
    - cron: "55 11 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "10 13 * * 1-5"
    - cron: "15 14 * * 1-5"
    - cron: "25 14 * * 1-5"
    # Regular-hours V3.1. Each 09:35-15:35 ET target gets target/+10m/+20m
    # delivery opportunities. The reusable worker resolves the ET slot and
    # skips retries once a successful slot marker exists.
    - cron: "35,45,55 13-20 * * 1-5"
    # Completed-session reconciliation. GitHub cron is UTC, so register both
    # EDT and EST equivalents; the called workflow gates on New York local time.
    - cron: "47 13 * * 1-5"
    - cron: "47 14 * * 1-5"
    - cron: "17 20 * * 1-5"
    - cron: "17 21 * * 1-5"
    # 20:17 ET lands on the following UTC day.
    - cron: "17 0 * * 2-6"
    - cron: "17 1 * * 2-6"

permissions:
  actions: read
  contents: read

jobs:
  external-premarket-open:
    if: github.event_name == 'issue_comment' && github.event.issue.number == 313 && github.actor == 'Bochniik' && github.event.comment.body == '/orion-acquire premarket-open'
    uses: ./.github/workflows/market-session-data-cloud.yml
    with:
      session: premarket
      phase: open
    secrets: inherit

  external-premarket-early:
    if: github.event_name == 'issue_comment' && github.event.issue.number == 313 && github.actor == 'Bochniik' && github.event.comment.body == '/orion-acquire premarket early'
    uses: ./.github/workflows/premarket-v5-cloud-shadow.yml
    with:
      external_snapshot: early
      external_trigger_created_at: ${{ github.event.comment.created_at }}
      external_actor: ${{ github.actor }}
      external_issue: 313
    secrets: inherit

  external-premarket-mid:
    if: github.event_name == 'issue_comment' && github.event.issue.number == 313 && github.actor == 'Bochniik' && github.event.comment.body == '/orion-acquire premarket mid'
    uses: ./.github/workflows/premarket-v5-cloud-shadow.yml
    with:
      external_snapshot: mid
      external_trigger_created_at: ${{ github.event.comment.created_at }}
      external_actor: ${{ github.actor }}
      external_issue: 313
    secrets: inherit

  external-premarket-late:
    if: github.event_name == 'issue_comment' && github.event.issue.number == 313 && github.actor == 'Bochniik' && github.event.comment.body == '/orion-acquire premarket late'
    uses: ./.github/workflows/premarket-v5-cloud-shadow.yml
    with:
      external_snapshot: late
      external_trigger_created_at: ${{ github.event.comment.created_at }}
      external_actor: ${{ github.actor }}
      external_issue: 313
    secrets: inherit

  external-regular-open:
    if: github.event_name == 'issue_comment' && github.event.issue.number == 313 && github.actor == 'Bochniik' && github.event.comment.body == '/orion-acquire regular-open'
    uses: ./.github/workflows/market-session-data-cloud.yml
    with:
      session: regular
      phase: open
    secrets: inherit

  external-regular-hours:
    if: github.event_name == 'issue_comment' && github.event.issue.number == 313 && github.actor == 'Bochniik' && github.event.comment.body == '/orion-acquire regular'
    uses: ./.github/workflows/regular-hours-v3-1-cloud-shadow.yml
    with:
      external_trigger_created_at: ${{ github.event.comment.created_at }}
      external_actor: ${{ github.actor }}
      external_issue: 313
    secrets: inherit

  premarket-session-open:
    if: github.event.schedule == '7 8 * * 1-5' || github.event.schedule == '7 9 * * 1-5'
    uses: ./.github/workflows/market-session-data-cloud.yml
    with:
      session: premarket
      phase: open
    secrets: inherit

  regular-session-open:
    if: github.event.schedule == '37 13 * * 1-5' || github.event.schedule == '37 14 * * 1-5'
    uses: ./.github/workflows/market-session-data-cloud.yml
    with:
      session: regular
      phase: open
    secrets: inherit

  after-hours-session-open:
    if: github.event.schedule == '7 20 * * 1-5' || github.event.schedule == '7 21 * * 1-5'
    uses: ./.github/workflows/market-session-data-cloud.yml
    with:
      session: after_hours
      phase: open
    secrets: inherit

  premarket-v5:
    if: >-
      github.event.schedule == '45 10 * * 1-5' ||
      github.event.schedule == '55 10 * * 1-5' ||
      github.event.schedule == '0 12 * * 1-5' ||
      github.event.schedule == '10 12 * * 1-5' ||
      github.event.schedule == '15 13 * * 1-5' ||
      github.event.schedule == '25 13 * * 1-5' ||
      github.event.schedule == '45 11 * * 1-5' ||
      github.event.schedule == '55 11 * * 1-5' ||
      github.event.schedule == '0 13 * * 1-5' ||
      github.event.schedule == '10 13 * * 1-5' ||
      github.event.schedule == '15 14 * * 1-5' ||
      github.event.schedule == '25 14 * * 1-5'
    uses: ./.github/workflows/premarket-v5-cloud-shadow.yml
    secrets: inherit

  regular-hours-v3-1:
    if: github.event.schedule == '35,45,55 13-20 * * 1-5'
    uses: ./.github/workflows/regular-hours-v3-1-cloud-shadow.yml
    secrets: inherit

  premarket-session-data:
    if: >-
      github.event.schedule == '47 13 * * 1-5' ||
      github.event.schedule == '47 14 * * 1-5'
    uses: ./.github/workflows/market-session-data-cloud.yml
    with:
      session: premarket
      phase: close
    secrets: inherit

  regular-session-data:
    if: >-
      github.event.schedule == '17 20 * * 1-5' ||
      github.event.schedule == '17 21 * * 1-5'
    uses: ./.github/workflows/market-session-data-cloud.yml
    with:
      session: regular
      phase: close
    secrets: inherit

  after-hours-session-data:
    if: >-
      github.event.schedule == '17 0 * * 2-6' ||
      github.event.schedule == '17 1 * * 2-6'
    uses: ./.github/workflows/market-session-data-cloud.yml
    with:
      session: after_hours
      phase: close
    secrets: inherit
