name: Market session data cloud reconciliation
run-name: Session data ${{ inputs.session }} ${{ github.event_name }}

on:
  workflow_call:
    inputs:
      session:
        description: Market session to reconcile
        required: true
        type: string
      phase:
        description: Session collection phase (open probe or completed reconciliation)
        required: false
        type: string
        default: close
      symbols:
        description: Space-separated frozen symbol basket
        required: false
        type: string
        default: "AAPL MSFT NVDA AMZN META GOOGL TSLA AMD SPY QQQ"
  workflow_dispatch:
    inputs:
      session:
        description: Market session to reconcile
        required: true
        type: choice
        options: [premarket, regular, after_hours]
      phase:
        description: Session collection phase
        required: true
        type: choice
        options: [open, close]
        default: close
      symbols:
        description: Space-separated frozen symbol basket
        required: false
        default: "AAPL MSFT NVDA AMZN META GOOGL TSLA AMD SPY QQQ"

permissions:
  contents: read

concurrency:
  group: market-session-data-${{ inputs.session }}-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Gate scheduled reconciliation on New York local time
        id: schedule_gate
        shell: bash
        env:
          SESSION: ${{ inputs.session }}
          PHASE: ${{ inputs.phase }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LOCAL_HOUR="$(TZ=America/New_York date +'%H')"
          LOCAL_MINUTE="$(TZ=America/New_York date +'%M')"
          case "${SESSION}:${PHASE}" in
            premarket:open) TARGET_HOUR=04; TARGET_MINUTE=07 ;;
            regular:open) TARGET_HOUR=09; TARGET_MINUTE=37 ;;
            after_hours:open) TARGET_HOUR=16; TARGET_MINUTE=07 ;;
            premarket:close) TARGET_HOUR=09; TARGET_MINUTE=47 ;;
            regular:close) TARGET_HOUR=16; TARGET_MINUTE=17 ;;
            after_hours:close) TARGET_HOUR=20; TARGET_MINUTE=17 ;;
            *) echo "Unsupported session: $SESSION" >&2; exit 2 ;;
          esac
          if [ "$LOCAL_HOUR" = "$TARGET_HOUR" ] && [ $((10#$LOCAL_MINUTE)) -ge $((10#$TARGET_MINUTE)) ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Skipping DST-inactive slot: session=$SESSION local=${LOCAL_HOUR}:${LOCAL_MINUTE} ET"
          fi
      - uses: actions/setup-python@v5
        if: steps.schedule_gate.outputs.active == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install focused collection dependencies
        if: steps.schedule_gate.outputs.active == 'true'
        run: python -m pip install httpx python-dotenv
      - name: Verify cloud credentials
        if: steps.schedule_gate.outputs.active == 'true'
        shell: bash
        run: |
          if [ -z "$ALPACA_API_KEY_ID" ] || [ -z "$ALPACA_API_SECRET_KEY" ]; then
            echo "Missing repository secrets ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY." >&2
            exit 2
          fi
      - name: Reconcile completed market session
        if: steps.schedule_gate.outputs.active == 'true'
        shell: bash
        env:
          SESSION: ${{ inputs.session }}
          PHASE: ${{ inputs.phase }}
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          set -euo pipefail
          SESSION_DATE="$(TZ=America/New_York date +'%Y-%m-%d')"
          OUTPUT_DIR="backend/data/cloud_shadow/market_sessions/${SESSION_DATE}"
          OUTPUT="${OUTPUT_DIR}/${SESSION}-${PHASE}-iex-${GITHUB_RUN_ID}.csv"
          mkdir -p "$OUTPUT_DIR"
          python scripts/collect_alpaca_session_data.py \
            --session "$SESSION" \
            --session-date "$SESSION_DATE" \
            --symbols $SYMBOLS \
            --feed iex \
            --phase "$PHASE" \
            --output "$OUTPUT"
      - name: Upload immutable session dataset and receipt
        if: steps.schedule_gate.outputs.active == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: market-session-${{ inputs.session }}-${{ inputs.phase }}-${{ github.run_id }}
          path: backend/data/cloud_shadow/market_sessions/**/*
          if-no-files-found: warn
          retention-days: 90
