name: Market session data cloud reconciliation
run-name: Session data ${{ inputs.session }} ${{ github.event_name }}

on:
  workflow_call:
    inputs:
      session:
        description: Market session to reconcile
        required: true
        type: string
      phase:
        description: Session collection phase (open probe or completed reconciliation)
        required: false
        type: string
        default: close
      symbols:
        description: Space-separated frozen symbol basket
        required: false
        type: string
        default: "AAPL MSFT NVDA AMZN META GOOGL TSLA AMD SPY QQQ"
  workflow_dispatch:
    inputs:
      session:
        description: Market session to reconcile
        required: true
        type: choice
        options: [premarket, regular, after_hours]
      phase:
        description: Session collection phase
        required: true
        type: choice
        options: [open, close]
        default: close
      symbols:
        description: Space-separated frozen symbol basket
        required: false
        default: "AAPL MSFT NVDA AMZN META GOOGL TSLA AMD SPY QQQ"

permissions:
  actions: read
  contents: read

concurrency:
  group: market-session-data-${{ inputs.session }}-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Gate scheduled reconciliation on New York target window
        id: schedule_gate
        shell: bash
        env:
          SESSION: ${{ inputs.session }}
          PHASE: ${{ inputs.phase }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "session_date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
            echo "target_slot=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import os
          from datetime import datetime, time
          from zoneinfo import ZoneInfo

          ny = ZoneInfo("America/New_York")
          now = datetime.now(ny)
          targets = {
              ("premarket", "open"): time(4, 7),
              ("regular", "open"): time(9, 37),
              ("after_hours", "open"): time(16, 7),
              ("premarket", "close"): time(9, 47),
              ("regular", "close"): time(16, 17),
              ("after_hours", "close"): time(20, 17),
          }
          key = (os.environ["SESSION"], os.environ["PHASE"])
          if key not in targets:
              raise SystemExit(f"Unsupported session/phase: {key}")
          target = datetime.combine(now.date(), targets[key], tzinfo=ny)
          lag = (now - target).total_seconds() / 60.0
          active = 0.0 <= lag <= 20.0
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"active={'true' if active else 'false'}\n")
              out.write(f"session_date={now.date().isoformat()}\n")
              out.write(f"target_slot={target.strftime('%H%M')}\n")
              out.write(f"lag_minutes={lag:.3f}\n")
          print(f"session={key[0]} phase={key[1]} target={target.isoformat()} now={now.isoformat()} lag={lag:.3f} active={active}")
          PY

      - name: Check for prior successful session collection
        id: dedupe
        if: steps.schedule_gate.outputs.active == 'true' && github.event_name == 'schedule'
        shell: bash
        env:
          SESSION: ${{ inputs.session }}
          PHASE: ${{ inputs.phase }}
          SESSION_DATE: ${{ steps.schedule_gate.outputs.session_date }}
          TARGET_SLOT: ${{ steps.schedule_gate.outputs.target_slot }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MARKER="market-session-success-${SESSION}-${PHASE}-${SESSION_DATE}-${TARGET_SLOT}"
          COUNT="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${MARKER}&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | length')"
          if [ "$COUNT" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Successful session artifact already exists; retry skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.schedule_gate.outputs.active == 'true' && (github.event_name != 'schedule' || steps.dedupe.outputs.exists != 'true')
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install focused collection dependencies
        if: steps.schedule_gate.outputs.active == 'true' && (github.event_name != 'schedule' || steps.dedupe.outputs.exists != 'true')
        run: python -m pip install httpx python-dotenv
      - name: Verify cloud credentials
        if: steps.schedule_gate.outputs.active == 'true' && (github.event_name != 'schedule' || steps.dedupe.outputs.exists != 'true')
        shell: bash
        run: |
          if [ -z "$ALPACA_API_KEY_ID" ] || [ -z "$ALPACA_API_SECRET_KEY" ]; then
            echo "Missing repository secrets ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY." >&2
            exit 2
          fi
      - name: Reconcile completed market session
        if: steps.schedule_gate.outputs.active == 'true' && (github.event_name != 'schedule' || steps.dedupe.outputs.exists != 'true')
        shell: bash
        env:
          SESSION: ${{ inputs.session }}
          PHASE: ${{ inputs.phase }}
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          set -euo pipefail
          SESSION_DATE="$(TZ=America/New_York date +'%Y-%m-%d')"
          OUTPUT_DIR="backend/data/cloud_shadow/market_sessions/${SESSION_DATE}"
          OUTPUT="${OUTPUT_DIR}/${SESSION}-${PHASE}-iex-${GITHUB_RUN_ID}.csv"
          mkdir -p "$OUTPUT_DIR"
          python scripts/collect_alpaca_session_data.py \
            --session "$SESSION" \
            --session-date "$SESSION_DATE" \
            --symbols $SYMBOLS \
            --feed iex \
            --phase "$PHASE" \
            --output "$OUTPUT"
      - name: Write successful session marker
        if: success() && github.event_name == 'schedule' && steps.schedule_gate.outputs.active == 'true' && steps.dedupe.outputs.exists != 'true'
        shell: bash
        run: |
          printf '%s\n' \
            "session=${{ inputs.session }}" \
            "phase=${{ inputs.phase }}" \
            "session_date=${{ steps.schedule_gate.outputs.session_date }}" \
            "target_slot=${{ steps.schedule_gate.outputs.target_slot }}" \
            "github_run_id=$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/market-session-success.txt"

      - name: Publish successful session marker
        if: success() && github.event_name == 'schedule' && steps.schedule_gate.outputs.active == 'true' && steps.dedupe.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: market-session-success-${{ inputs.session }}-${{ inputs.phase }}-${{ steps.schedule_gate.outputs.session_date }}-${{ steps.schedule_gate.outputs.target_slot }}
          path: ${{ runner.temp }}/market-session-success.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload immutable session dataset and receipt
        if: steps.schedule_gate.outputs.active == 'true' && always() && (github.event_name != 'schedule' || steps.dedupe.outputs.exists != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: market-session-${{ inputs.session }}-${{ inputs.phase }}-${{ github.run_id }}
          path: backend/data/cloud_shadow/market_sessions/**/*
          if-no-files-found: warn
          retention-days: 90
