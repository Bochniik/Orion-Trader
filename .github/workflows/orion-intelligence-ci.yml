name: Orion Intelligence CI

on:
  pull_request:
    paths:
      - 'backend/app/api/intelligence_routes.py'
      - 'backend/app/services/portfolio_intelligence.py'
      - 'backend/tests/test_intelligence_routes.py'
      - 'backend/tests/test_portfolio_intelligence.py'
      - 'frontend/src/core/IntelligenceView.jsx'
      - 'frontend/src/core/EngineBay.jsx'
      - 'frontend/src/core/PositionSizingAssistant.jsx'
      - 'frontend/src/core/TickerIntelligencePanels.jsx'
      - 'frontend/src/core/RelationshipEarningsPanels.jsx'
      - 'frontend/src/core/intelligence.css'
      - 'frontend/src/core/engineBay.css'
      - 'frontend/src/navigation.js'
      - 'frontend/src/navigation.test.js'
      - 'frontend/src/api/api.js'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/orion-intelligence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-intelligence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Orion Intelligence backend tests
        run: python -m pytest -q tests/test_intelligence_routes.py tests/test_portfolio_intelligence.py

  frontend-intelligence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build
