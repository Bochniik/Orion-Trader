name: Market session data CI

on:
  pull_request:
    paths:
      - "scripts/collect_alpaca_session_data.py"
      - "scripts/test_collect_alpaca_session_data.py"
      - ".github/workflows/market-session-data-cloud.yml"
      - ".github/workflows/market-session-data-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/collect_alpaca_session_data.py"
      - "scripts/test_collect_alpaca_session_data.py"
      - ".github/workflows/market-session-data-cloud.yml"
      - ".github/workflows/market-session-data-ci.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile session collector
        run: python -m py_compile scripts/collect_alpaca_session_data.py
      - name: Run deterministic session collector tests
        run: python scripts/test_collect_alpaca_session_data.py -v
