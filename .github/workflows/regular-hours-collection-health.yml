name: Regular-hours collection health

on:
  workflow_dispatch:
  schedule:
    # Post-close in both EDT and EST; delayed delivery is harmless for this audit.
    - cron: "20 22 * * 1-5"

permissions:
  actions: read
  contents: read

concurrency:
  group: regular-hours-collection-health
  cancel-in-progress: false

jobs:
  audit-collection-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recover and authenticate recent regular-hours prediction artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .regular-hours-health-inputs
          CUTOFF_EPOCH=$(date -u -d '30 days ago' +%s)
          RECOVERED=0
          INELIGIBLE=0
          LEGACY_PROVENANCE=0

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id,.name,.created_at,(.workflow_run.id // ""),(.workflow_run.head_sha // "")] | @tsv' > /tmp/orion-artifacts.tsv

          while IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_NAME CREATED_AT ARTIFACT_RUN_ID ARTIFACT_HEAD_SHA; do
            if [[ "$ARTIFACT_NAME" != regular-hours-v3-1-shadow-* ]]; then
              continue
            fi
            CREATED_EPOCH=$(date -u -d "$CREATED_AT" +%s)
            if [ "$CREATED_EPOCH" -lt "$CUTOFF_EPOCH" ]; then
              continue
            fi
            RUN_ID="${ARTIFACT_NAME##*-}"
            if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "Malformed regular-hours artifact run id: $ARTIFACT_NAME" >&2
              exit 3
            fi
            if [ "$ARTIFACT_RUN_ID" != "$RUN_ID" ]; then
              echo "Regular-hours artifact producing run mismatch: artifact=$ARTIFACT_NAME metadata_run=$ARTIFACT_RUN_ID" >&2
              exit 5
            fi

            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > "/tmp/regular-hours-run-${RUN_ID}.json"
            RUN_HEAD_SHA=$(jq -r '.head_sha // ""' "/tmp/regular-hours-run-${RUN_ID}.json")
            if [ "${ARTIFACT_HEAD_SHA,,}" != "${RUN_HEAD_SHA,,}" ]; then
              echo "Regular-hours artifact head SHA does not match producing run metadata: $ARTIFACT_NAME" >&2
              exit 5
            fi
            RUN_EVENT=$(jq -r '.event // ""' "/tmp/regular-hours-run-${RUN_ID}.json")
            if [ "$RUN_EVENT" != "schedule" ]; then
              echo "Skipping non-forward regular-hours artifact: $ARTIFACT_NAME event=$RUN_EVENT"
              continue
            fi

            DEST=".regular-hours-health-inputs/${ARTIFACT_ID}"
            mkdir -p "$DEST"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "/tmp/regular-hours-${ARTIFACT_ID}.zip"
            unzip -q -o "/tmp/regular-hours-${ARTIFACT_ID}.zip" -d "$DEST"
            PREDICTION="$DEST/prediction-${RUN_ID}.json"
            if [ ! -f "$PREDICTION" ]; then
              echo "Expected regular-hours prediction payload missing from artifact $ARTIFACT_NAME" >&2
              exit 4
            fi
            ORIGIN_ERROR="/tmp/regular-hours-origin-${RUN_ID}.err"
            if ! ORIGIN_JSON=$(python scripts/validate_regular_hours_v3_1_artifact_origin.py \
              --prediction "$PREDICTION" \
              --artifact-name "$ARTIFACT_NAME" \
              --run-metadata "/tmp/regular-hours-run-${RUN_ID}.json" \
              --allow-ineligible 2>"$ORIGIN_ERROR"); then
              if grep -q "Prediction payload has unsupported acquisition provenance" "$ORIGIN_ERROR"; then
                echo "Excluding legacy regular-hours artifact without supported acquisition provenance: $ARTIFACT_NAME"
                rm -f "$PREDICTION"
                LEGACY_PROVENANCE=$((LEGACY_PROVENANCE + 1))
                continue
              fi
              cat "$ORIGIN_ERROR" >&2
              exit 6
            fi
            if [ "$(jq -r '.forward_eligible' <<<"$ORIGIN_JSON")" != "true" ]; then
              echo "Authenticated scheduled artifact is not decision-grade eligible: $ARTIFACT_NAME"
              rm -f "$PREDICTION"
              INELIGIBLE=$((INELIGIBLE + 1))
              continue
            fi
            echo "$ORIGIN_JSON"
            RECOVERED=$((RECOVERED + 1))
          done < /tmp/orion-artifacts.tsv

          echo "Recovered ${RECOVERED} authenticated eligible scheduled regular-hours artifacts from the trailing 30 days; excluded ${INELIGIBLE} authenticated inactive samples and ${LEGACY_PROVENANCE} legacy provenance samples."

      - name: Build score-blind collection health report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/data/cloud_shadow/regular_hours_v3_1/health
          mapfile -t PREDICTIONS < <(find .regular-hours-health-inputs -type f -name 'prediction-*.json' | sort)
          python scripts/audit_regular_hours_forward_completeness.py \
            "${PREDICTIONS[@]}" \
            --output backend/data/cloud_shadow/regular_hours_v3_1/health/collection-health-${{ github.run_id }}.json

      - name: Audit scheduled session cadence
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="backend/data/cloud_shadow/regular_hours_v3_1/health/collection-health-${{ github.run_id }}.json"
          python scripts/audit_regular_hours_session_cadence.py \
            "$HEALTH" \
            --output backend/data/cloud_shadow/regular_hours_v3_1/health/session-cadence-${{ github.run_id }}.json

      - name: Upload collection health and cadence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regular-hours-collection-health-${{ github.run_id }}
          path: backend/data/cloud_shadow/regular_hours_v3_1/health/*.json
          if-no-files-found: warn
          retention-days: 90
