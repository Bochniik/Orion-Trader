name: Early premarket run reconciliation CI

on:
  pull_request:
    paths:
      - "scripts/audit_early_premarket_acquisition_health.py"
      - "scripts/reconcile_early_premarket_run_history.py"
      - "scripts/test_reconcile_early_premarket_run_history.py"
      - ".github/workflows/early-premarket-run-reconciliation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-history-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile reconciliation contract
        run: python -m py_compile scripts/audit_early_premarket_acquisition_health.py scripts/reconcile_early_premarket_run_history.py scripts/test_reconcile_early_premarket_run_history.py
      - name: Run reconciliation regression tests
        working-directory: scripts
        run: python -m unittest -v test_early_premarket_acquisition_health.py test_reconcile_early_premarket_run_history.py
