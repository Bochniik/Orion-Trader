name: Premarket v5 cloud shadow CI

on:
  pull_request:
    paths:
      - "scripts/run_premarket_v5_cloud_shadow.py"
      - "scripts/resolve_premarket_v5_snapshot.py"
      - "scripts/audit_premarket_v5_collection_health.py"
      - "scripts/finalize_premarket_v5_forward_artifact.py"
      - "scripts/audit_premarket_v5_forward_readiness.py"
      - "scripts/audit_premarket_v5_schedule_delivery.py"
      - "scripts/audit_premarket_v5_evidence_health.py"
      - "scripts/collect_premarket_v5_actions_evidence.py"
      - "scripts/nyse_session_calendar.py"
      - "backend/tests/test_nyse_session_calendar.py"
      - "backend/tests/test_premarket_v5_cloud_shadow.py"
      - "backend/tests/test_premarket_v5_snapshot_schedule.py"
      - "backend/tests/test_premarket_v5_collection_health.py"
      - "backend/tests/test_premarket_v5_readiness_gate.py"
      - "backend/tests/test_premarket_v5_forward_acquisition.py"
      - "backend/tests/test_premarket_v5_head_sha_attestation.py"
      - "backend/tests/test_premarket_v5_schedule_delivery.py"
      - "backend/tests/test_premarket_v5_evidence_health.py"
      - "backend/tests/test_premarket_v5_actions_evidence.py"
      - "backend/tests/test_premarket_v5_evidence_retention.py"
      - ".github/workflows/premarket-v5-cloud-shadow*.yml"
      - ".github/workflows/premarket-v5-evidence-health.yml"
      - "scripts/premarket_directional_v5_common.py"
      - "scripts/premarket_directional_v4_common.py"
      - "scripts/build_premarket_training_dataset*.py"
      - "backend/app/services/premarket_predictive_engine.py"
      - "backend/requirements.txt"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest
      - name: Compile cloud shadow path
        run: |
          python -m py_compile scripts/run_premarket_v5_cloud_shadow.py
          python -m py_compile scripts/resolve_premarket_v5_snapshot.py
          python -m py_compile scripts/audit_premarket_v5_collection_health.py
          python -m py_compile scripts/finalize_premarket_v5_forward_artifact.py
          python -m py_compile scripts/audit_premarket_v5_forward_readiness.py
          python -m py_compile scripts/audit_premarket_v5_schedule_delivery.py
          python -m py_compile scripts/audit_premarket_v5_evidence_health.py
          python -m py_compile scripts/collect_premarket_v5_actions_evidence.py
          python -m py_compile scripts/nyse_session_calendar.py
          python -m py_compile scripts/premarket_directional_v5_common.py
          python -m py_compile scripts/build_premarket_training_dataset_v2.py
      - name: Run cloud shadow regression tests
        run: |
          python -m pytest -q \
            backend/tests/test_nyse_session_calendar.py \
            backend/tests/test_premarket_v5_cloud_shadow.py \
            backend/tests/test_premarket_v5_snapshot_schedule.py \
            backend/tests/test_premarket_v5_collection_health.py \
            backend/tests/test_premarket_v5_readiness_gate.py \
            backend/tests/test_premarket_v5_forward_acquisition.py \
            backend/tests/test_premarket_v5_head_sha_attestation.py \
            backend/tests/test_premarket_v5_schedule_delivery.py \
            backend/tests/test_premarket_v5_evidence_health.py \
            backend/tests/test_premarket_v5_actions_evidence.py \
            backend/tests/test_premarket_v5_evidence_retention.py
