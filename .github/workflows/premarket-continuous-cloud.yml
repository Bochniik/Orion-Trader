name: Premarket continuous cloud
run-name: Premarket continuous ${{ github.event_name }} ${{ github.event.schedule || 'manual' }}

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premarket-continuous-cloud
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify cloud credentials
        shell: bash
        run: |
          if [ -z "$ALPACA_API_KEY_ID" ] || [ -z "$ALPACA_API_SECRET_KEY" ]; then
            echo "Missing repository secrets ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY." >&2
            exit 2
          fi

      - name: Run one continuous premarket cloud cycle
        env:
          PYTHONPATH: backend
        run: |
          python scripts/run_premarket_continuous_cloud.py \
            --output backend/data/cloud_shadow/premarket_continuous/latest.json

      - name: Upload cloud live-state artifact
        uses: actions/upload-artifact@v4
        with:
          name: premarket-continuous-${{ github.run_id }}
          path: backend/data/cloud_shadow/premarket_continuous/latest.json
          if-no-files-found: error
          retention-days: 14
