name: Intraday calibration audit

on:
  pull_request:
    paths:
      - "backend/app/services/intraday_probability_backtest_v3.py"
      - "backend/app/services/intraday_probability_calibration_v3_1.py"
      - "backend/evals/audit_intraday_calibration_v3_1.py"
      - "backend/evals/benchmark_intraday_calibration_v3_1.py"
      - "backend/tests/test_intraday_calibration_audit_v3_1.py"
      - "backend/tests/test_intraday_calibration_benchmark_v3_1.py"
      - ".github/workflows/intraday-calibration-audit.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/services/intraday_probability_backtest_v3.py"
      - "backend/app/services/intraday_probability_calibration_v3_1.py"
      - "backend/evals/audit_intraday_calibration_v3_1.py"
      - "backend/evals/benchmark_intraday_calibration_v3_1.py"
      - "backend/tests/test_intraday_calibration_audit_v3_1.py"
      - "backend/tests/test_intraday_calibration_benchmark_v3_1.py"
      - ".github/workflows/intraday-calibration-audit.yml"

permissions:
  contents: read

jobs:
  calibration-audit-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install numpy pandas pytest
      - name: Compile calibration audit modules
        run: >-
          python -m py_compile
          backend/app/services/intraday_probability_backtest_v3.py
          backend/app/services/intraday_probability_calibration_v3_1.py
          backend/evals/audit_intraday_calibration_v3_1.py
          backend/evals/benchmark_intraday_calibration_v3_1.py
      - name: Run calibration audit regression tests
        run: >-
          python -m pytest
          backend/tests/test_intraday_calibration_audit_v3_1.py
          backend/tests/test_intraday_calibration_benchmark_v3_1.py
          -q
