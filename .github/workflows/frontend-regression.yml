name: Frontend regression

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-regression.yml"

concurrency:
  group: frontend-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Vitest and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend regression tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee vitest-output.txt

      - name: Build production frontend
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.txt

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-regression-diagnostics
          path: |
            frontend/vitest-output.txt
            frontend/build-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce regression gate
        if: always()
        working-directory: .
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          echo "Vitest: ${TEST_OUTCOME}"
          echo "Production build: ${BUILD_OUTCOME}"
          if [ "${TEST_OUTCOME}" != "success" ] || [ "${BUILD_OUTCOME}" != "success" ]; then
            exit 1
          fi
