name: Frontend regression

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Vitest and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend regression tests
        run: npm test

      - name: Build production frontend
        run: npm run build
