# GitHub-independent CI for OrionTrader on CircleCI Free.
# Runs only tests/builds: no credentials, trading, deployment or model writes.
version: 2.1

jobs:
  backend-regressions:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install backend and pytest dependencies
          command: |
            python -m pip install --disable-pip-version-check -r backend/requirements.txt
            python -m pip install --disable-pip-version-check 'pytest>=8.3,<10'
      - run:
          name: Integration, Intelligence, session and news regression tests
          command: |
            set -euo pipefail
            tests=(
              backend/tests/test_intelligence_routes.py
              backend/tests/test_portfolio_intelligence.py
              backend/tests/test_market_session_engine.py
              backend/tests/test_regular_hours_nyse_session_gate.py
              backend/tests/test_core_milestone2.py
              backend/tests/test_orion_ai_service.py
              backend/tests/test_market_data.py
            )
            # PR #397 adds this test; it is not yet present on main.
            if [ -f backend/tests/test_ourai_bridge.py ]; then
              tests+=(backend/tests/test_ourai_bridge.py)
            fi
            # Opt-in launcher safety contract must be exercised on every PR.
            if [ -f backend/tests/test_ourai_launcher_contract.py ]; then
              tests+=(backend/tests/test_ourai_launcher_contract.py)
            fi
            python -m pytest -q "${tests[@]}"
      - run:
          name: Analytics regression manifest
          command: |
            set -euo pipefail
            python -m py_compile backend/evals/evaluate_directional_model.py
            mapfile -t tests < <(grep -Ev '^[[:space:]]*(#|$)' .github/analytics-regression-tests.txt)
            if [ "${#tests[@]}" -eq 0 ]; then
              echo "Analytics regression test manifest is empty" >&2
              exit 1
            fi
            python -m pytest -q "${tests[@]}"

  ourai-cross-repo-loopback:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Fetch immutable public OurAI producer for reproducible contract CI
          command: |
            set -euo pipefail
            # Cross-repository tests must exercise a known producer revision.
            # A moving OurAI main makes a previously green Orion SHA non-reproducible.
            OURAI_CONTRACT_SHA=03753da4201d98f62b392fc357695712be767764
            git init /tmp/ourai-public
            git -C /tmp/ourai-public remote add origin https://github.com/Bochniik/OurAi.git
            GIT_TERMINAL_PROMPT=0 git -C /tmp/ourai-public -c credential.helper= \
              fetch --depth 1 origin "$OURAI_CONTRACT_SHA"
            git -C /tmp/ourai-public checkout --detach FETCH_HEAD
            test "$(git -C /tmp/ourai-public rev-parse HEAD)" = "$OURAI_CONTRACT_SHA"
            echo "Orion exact CI checkout: $(git rev-parse HEAD)"
            echo "OurAI immutable contract revision: $OURAI_CONTRACT_SHA"
      - run:
          name: Test actual OurAI producer with Orion consumer on trusted loopback
          command: |
            set -euo pipefail
            python -m pip install --disable-pip-version-check 'httpx>=0.27,<1'
            OURAI_SOURCE_ROOT=/tmp/ourai-public python -m unittest discover \
              -s backend/tests -p 'test_ourai_crossrepo_loopback_contract.py' -v

  frontend-regressions:
    docker:
      - image: cimg/node:24.0
    resource_class: small
    working_directory: ~/project/frontend
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install locked frontend dependencies
          command: npm ci --no-audit --no-fund
      - run:
          name: Vitest regression suite
          command: npm test
      - run:
          name: Build production frontend
          command: npm run build

workflows:
  regression-checks:
    jobs:
      - backend-regressions
      - frontend-regressions
      - ourai-cross-repo-loopback
